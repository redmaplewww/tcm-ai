<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中医AI问诊助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230f766e'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white'%3E医%3C/text%3E%3C/svg%3E">
<style>
:root{
  --teal:#0f766e; --teal-light:#14b8a6; --bg:#f0f5f4; --card:#ffffff;
  --ink:#1f2937; --muted:#6b7280; --amber-bg:#fffbeb; --amber-bd:#f59e0b;
  --red:#dc2626; --red-bg:#fef2f2; --blue:#2563eb; --blue-bg:#eff6ff;
  --purple:#7c3aed; --purple-bg:#f5f3ff; --green:#16a34a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0}
header h1{font-size:19px;font-weight:600}
header .sub{font-size:12px;opacity:.85}
.chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:3px 12px;font-size:12px}
.layout{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;padding:14px 20px;min-height:0}
@media(max-width:900px){.layout{grid-template-columns:1fr;overflow-y:auto}}

/* ---------- 对话区 ---------- */
.chat-card{background:var(--card);border-radius:14px;display:flex;flex-direction:column;min-height:0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.chat-head{padding:12px 18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.chat-head b{font-size:15px}
#chat-log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:82%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#f3f4f6;border-bottom-left-radius:4px}
.block{align-self:flex-start;max-width:92%;border-radius:10px;padding:9px 13px;font-size:13px;line-height:1.65;margin-top:-8px}
.block.challenge{background:var(--amber-bg);border:1px solid var(--amber-bd);color:#92400e}
.block.challenge::before{content:"⚠ 需核实 · ";font-weight:700}
.block.excluded{background:#f9fafb;border:1px dashed #d1d5db;color:var(--muted)}
.block.excluded::before{content:"存疑/说明 · ";font-weight:700}
.block.assess{background:var(--blue-bg);border:1px solid #bfdbfe;color:#1e40af}
.block.change{background:var(--purple-bg);border:1px solid #ddd6fe;color:#5b21b6}
.block.change::before{content:"⟳ 证型更新 · ";font-weight:700}
.emergency{align-self:stretch;background:var(--red-bg);border:2px solid var(--red);color:var(--red);border-radius:12px;padding:14px;font-size:14px;font-weight:600;line-height:1.7}
.emergency::before{content:"🚨 "}

/* ---------- 结果卡 ---------- */
.final-card{align-self:stretch;background:var(--card);border:1px solid #d1d5db;border-radius:12px;overflow:hidden;font-size:13.5px}
.final-card .fc-head{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:10px 16px;font-weight:700}
.fc-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.synd{border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px}
.synd.main{border:2px solid var(--teal);background:#f0fdfa}
.synd h4{font-size:14px;margin-bottom:4px}
.synd .meta{color:var(--muted);font-size:12px;margin-bottom:6px}
.bar{height:8px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-light),var(--teal))}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 8px}
.kv b{color:var(--teal)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:#f3f4f6;border-radius:99px;padding:2px 10px;font-size:12px;color:#374151}
.tag.warn{background:var(--red-bg);color:var(--red);border:1px solid #fecaca}
ul.dot{padding-left:18px}
.disclaimer{font-size:12px;color:var(--muted);border-top:1px dashed #d1d5db;padding-top:8px}

/* ---------- 输入区 ---------- */
.input-row{padding:12px 14px;border-top:1px solid #e5e7eb;display:flex;gap:8px;flex-shrink:0}
.input-row input{flex:1;border:1px solid #d1d5db;border-radius:10px;padding:10px 12px;font-size:14px;outline:none}
.input-row input:focus{border-color:var(--teal-light)}
button{cursor:pointer;border:none;border-radius:10px;font-size:14px;padding:10px 16px;font-family:inherit}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:disabled{background:#9ca3af;cursor:not-allowed}
.btn-ghost{background:#f3f4f6;color:#374151;border:1px solid #d1d5db}
.thinking{padding:4px 18px 10px;font-size:12px;color:var(--muted);flex-shrink:0}

/* ---------- 侧栏 ---------- */
aside{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}
.panel{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06);flex-shrink:0}
.panel h3{font-size:14px;margin-bottom:10px;color:var(--teal)}
.panel .row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.panel select,.panel input[type=text],.panel input[type=number]{border:1px solid #d1d5db;border-radius:8px;padding:7px 9px;font-size:13px;outline:none}
.panel input[type=text]{flex:1;min-width:120px}
.demo-btn{background:var(--blue-bg);color:var(--blue);border:1px solid #bfdbfe;border-radius:8px;padding:7px 10px;font-size:12.5px}
.qresult{margin-top:10px;font-size:13px;line-height:1.6;max-height:260px;overflow-y:auto}
.qresult .item{border-left:3px solid var(--teal-light);background:#f8fafc;padding:6px 10px;border-radius:0 8px 8px 0;margin-bottom:8px}
.qresult .item b{font-size:13px}
.qresult .src{color:var(--muted);font-size:11.5px}
.herb-ok{color:var(--green);font-weight:700}
.herb-bad{color:var(--red);font-weight:700}
label.small{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
.rec-item{border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;cursor:pointer}
.rec-item:hover{border-color:var(--teal-light);background:#f0fdfa}
.rec-item .t{font-size:12px;color:var(--muted)}
.rec-item .s{font-weight:600;font-size:13px}
.msgline{padding:6px 10px;border-radius:8px;margin-bottom:6px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.msgline.user{background:var(--teal);color:#fff}
.msgline.assistant{background:#f3f4f6}
.meta-line{font-size:12px;color:#92400e}
</style>
</head>
<body>
<header>
  <h1>中医药智能问诊助手</h1>
  <span class="chip" id="chip-model">…</span>
  <span class="chip" id="chip-kb">…</span>
  <span class="chip" id="chip-user" style="cursor:pointer" onclick="document.getElementById('p-user').scrollIntoView()">👤 未登录</span>
  <span class="sub">多轮问诊 · 证据取证 · 动态辨证 | 仅供参考，不构成诊疗建议</span>
</header>

<div class="layout">
  <!-- ================= 对话区 ================= -->
  <section class="chat-card">
    <div class="chat-head">
      <b>💬 问诊对话</b>
      <button class="btn-ghost" style="padding:6px 14px;font-size:13px" onclick="newSession(true)">⟳ 新会话</button>
    </div>
    <div id="chat-log"></div>
    <div class="thinking" id="thinking" style="display:none"></div>
    <div class="input-row">
      <input id="msg-input" placeholder="描述症状，如：最近怕冷、发烧、没有汗…" onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="btn-primary" id="btn-send" onclick="sendMsg()">发送</button>
      <button class="btn-ghost" onclick="sendMsg(true)">立即辨证</button>
    </div>
  </section>

  <!-- ================= 侧栏 ================= -->
  <aside>
    <div class="panel" id="p-user">
      <h3>👤 账号</h3>
      <div id="auth-login" class="row" style="flex-direction:column;align-items:stretch;gap:6px">
        <input type="text" id="a-user" placeholder="用户名（2-20位）">
        <input type="password" id="a-pass" placeholder="密码（至少6位）">
        <div class="row" style="margin:0">
          <button class="btn-primary" style="flex:1;padding:8px" onclick="authLogin()">登录</button>
          <button class="btn-ghost" style="flex:1;padding:8px" onclick="authRegister()">注册</button>
        </div>
        <div class="t" style="font-size:12px;color:var(--muted)">登录后问诊数据归入账号，自动生成健康画像；不登录仍可游客使用</div>
      </div>
      <div id="auth-info" style="display:none">
        <div style="font-size:14px;margin-bottom:8px">👋 <b id="a-nick"></b>（<span id="a-name"></span>）</div>
        <div class="row" style="margin-bottom:0">
          <button class="btn-primary" style="flex:1;padding:8px" onclick="showProfile()">📊 我的画像</button>
          <button class="btn-ghost" style="padding:8px" onclick="importGuest()">📥 导入游客档案</button>
          <button class="btn-ghost" style="padding:8px" onclick="authLogout()">退出</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>👤 患者信息（新会话时生效）</h3>
      <div class="row">
        <select id="p-sex"><option value="">性别</option><option>男</option><option>女</option></select>
        <input type="number" id="p-age" placeholder="年龄" style="width:80px" min="0" max="120">
        <label class="small"><input type="checkbox" id="p-preg">怀孕</label>
      </div>
      <div class="row" style="margin-bottom:0">
        <button class="btn-primary" style="flex:1;padding:8px" onclick="newSession(true)">应用并开始新会话</button>
      </div>
    </div>

    <div class="panel">
      <h3>🧪 快速测试用例</h3>
      <div class="row">
        <button class="demo-btn" onclick="demo('我怕冷、有点发烧、身上没有汗，浑身酸痛，还流清鼻涕')">风寒感冒（多轮）</button>
        <button class="demo-btn" onclick="demo('我觉得我是肾虚，网上对照的，最近腰酸，晚上睡觉出汗')">自诊质询（肾虚）</button>
      </div>
      <div class="row" style="margin-bottom:0">
        <button class="demo-btn" onclick="demo('我最近心慌、睡不着、多梦、健忘，吃不下饭，浑身疲乏，请帮我分析一下')">心脾两虚（直接分析）</button>
        <button class="demo-btn" style="background:var(--red-bg);color:var(--red);border-color:#fecaca" onclick="demo('我爸突然胸口剧痛，疼到左胳膊，满头冷汗')">急症红旗</button>
      </div>
    </div>

    <div class="panel">
      <h3>📚 知识查询</h3>
      <div class="row">
        <input type="text" id="q-input" placeholder="如：什么是阴虚 / 麻黄的功效" onkeydown="if(event.key==='Enter')runQuery()">
        <select id="q-mode"><option value="auto">智能</option><option value="llm">LLM</option><option value="offline">检索</option></select>
        <button class="btn-primary" style="padding:8px 12px" onclick="runQuery()">查</button>
      </div>
      <div class="qresult" id="q-result"></div>
    </div>

    <div class="panel">
      <h3>⚗️ 配伍安全检查（十八反/十九畏）</h3>
      <div class="row">
        <input type="text" id="h-input" placeholder="输入药名，逗号分隔，如：甘草,甘遂" onkeydown="if(event.key==='Enter')runHerb()">
      </div>
      <div class="row" style="align-items:center">
        <label class="small"><input type="checkbox" id="h-preg">按怀孕检查</label>
        <button class="btn-primary" style="padding:8px 12px;margin-left:auto" onclick="runHerb()">检查</button>
      </div>
      <div class="qresult" id="h-result"></div>
    </div>

    <div class="panel" style="display:flex;flex-direction:column;min-height:140px">
      <h3>🗂 健康档案（自动保存）
        <button class="btn-ghost" style="padding:3px 10px;font-size:12px;float:right" onclick="loadRecords()">刷新</button>
      </h3>
      <div id="r-list" style="overflow-y:auto;font-size:13px;display:flex;flex-direction:column;gap:6px"></div>
    </div>
  </aside>
</div>

<!-- 档案详情弹窗 -->
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;padding:30px 16px;overflow-y:auto" onclick="if(event.target===this)closeModal()">
  <div style="background:#fff;max-width:860px;margin:0 auto;border-radius:14px;padding:18px 20px;max-height:calc(100vh - 60px);overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px">
      <b id="m-title" style="font-size:16px"></b>
      <div style="display:flex;gap:8px;flex-shrink:0">
        <button class="btn-primary" style="padding:4px 12px;font-size:13px" onclick="resumeRecord(window._recId)">💬 继续该问诊</button>
        <button class="btn-ghost" style="padding:4px 12px;font-size:13px;color:var(--red)" onclick="delRecord()">删除</button>
        <button class="btn-ghost" style="padding:4px 12px;font-size:13px" onclick="closeModal()">关闭</button>
      </div>
    </div>
    <div id="m-body"></div>
  </div>
</div>

<script>
/* 兼容HTTP非安全上下文：crypto.randomUUID在非HTTPS且非localhost的页面不可用 */
function makeId(){
  try { if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID(); } catch(e) {}
  return 's-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10) + '-' + Math.random().toString(36).slice(2, 8);
}
let sessionId = localStorage.getItem('tcm_session') || makeId();
let busy = false;
let authToken = localStorage.getItem('tcm_token') || '';
let currentUser = null;

const $ = id => document.getElementById(id);
const log = () => $('chat-log');

/* ---------------- 初始化 ---------------- */
(async () => {
  try {
    const r = await (await fetch('api/info')).json();
    $('chip-model').textContent = '模型：' + (r.llm_available ? r.model : '离线');
    $('chip-kb').textContent = `知识库 ${r.kb.files} 文件 · 证型${r.data['证型']} · 中药${r.data['中药']} · 方剂${r.data['方剂']} · 红旗${r.data['红旗规则']}条`;
  } catch (e) { $('chip-model').textContent = '服务未连接'; }
  // 恢复上次会话（刷新/重开浏览器不丢对话与报告）
  const saved = localStorage.getItem('tcm_session');
  if (saved) await resumeRecord(saved, true);
  if (!window._resumeOk) {
    addBot('您好，我是中医问诊助手。请描述您的主要不适（症状、持续时间、伴随表现），我会逐步追问并给出辨证参考。出现胸痛、偏瘫、大出血等急症表现时，请立即就医。');
  }
  loadRecords();
  await refreshAuth();
})();

/* ---------------- 账号 ---------------- */
function updateAuthUI(){
  const logged = !!currentUser;
  $('auth-login').style.display = logged ? 'none' : 'flex';
  $('auth-info').style.display = logged ? 'block' : 'none';
  if (logged){
    $('a-nick').textContent = currentUser.nickname;
    $('a-name').textContent = currentUser.username;
    $('chip-user').textContent = '👤 ' + currentUser.nickname;
  } else {
    $('chip-user').textContent = '👤 未登录';
  }
}

async function refreshAuth(){
  if (!authToken){ currentUser = null; updateAuthUI(); return; }
  try{
    const r = await (await fetch('api/auth/me?token='+encodeURIComponent(authToken))).json();
    currentUser = r.username ? r : null;
    if (!currentUser){ authToken=''; localStorage.removeItem('tcm_token'); }
  }catch(e){ /* 离线容忍 */ }
  updateAuthUI();
}

async function authRegister(){
  const username = $('a-user').value.trim(), password = $('a-pass').value;
  const r = await (await fetch('api/auth/register', {method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username, password})})).json();
  if (r.error){ alert('注册失败：'+r.error); return; }
  await afterAuthOk(r, '注册成功');
}

async function authLogin(){
  const username = $('a-user').value.trim(), password = $('a-pass').value;
  const r = await (await fetch('api/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username, password})})).json();
  if (r.error){ alert('登录失败：'+r.error); return; }
  await afterAuthOk(r, '登录成功');
}

async function afterAuthOk(r, msg){
  authToken = r.token; localStorage.setItem('tcm_token', authToken);
  currentUser = {username: r.username, nickname: r.nickname};
  updateAuthUI();
  newSession(true);
  addBot(`${msg}，欢迎${r.nickname}。之后问诊将归入您的账号并用于健康画像。`);
  loadRecords();
}

function authLogout(){
  authToken=''; currentUser=null; localStorage.removeItem('tcm_token');
  updateAuthUI(); newSession(true);
  addBot('已退出登录，切换为游客模式。');
  loadRecords();
}

async function importGuest(){
  if (!confirm('将游客档案导入当前账号（已有档案不覆盖）？')) return;
  try{
    const r = await (await fetch('api/auth/import-guest', {method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({token: authToken})})).json();
    if (r.error){ alert('导入失败：'+r.error); return; }
    alert('已导入 '+r.imported+' 条游客档案');
    newSession(false); loadRecords();
  }catch(e){ alert('导入失败：'+e.message); }
}

/* ---------------- 用户画像 ---------------- */
async function showProfile(){
  try{
    const p = await (await fetch('api/profile?token='+encodeURIComponent(authToken))).json();
    if (p.error){ alert('请先登录'); return; }
    window._recId = null;
    $('m-title').textContent = `📊 健康画像 · ${p.username}`;
    let h = '';
    if (p.dominant_constitution){
      h += `<div style="font-size:15px;margin-bottom:8px">体质倾向：<b style="color:var(--teal);font-size:18px">${esc(p.dominant_constitution)}</b>
        <span style="font-size:12px;color:var(--muted)">（${p.constitution_confident?'结论较明确':'证据尚分散，仅供参考'}）</span></div>`;
      Object.entries(p.constitution_scores).slice(0,4).forEach(([k,v])=>{
        h += `<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span style="width:56px;font-size:12px">${esc(k)}</span>
          <div class="bar" style="flex:1"><i style="width:${Math.round(v*100)}%"></i></div>
          <span style="font-size:12px;color:var(--muted)">${Math.round(v*100)}%</span></div>`;
      });
    } else {
      h += `<div style="font-size:13px;color:var(--muted)">暂无体质结论——完成几次问诊后自动生成（共${p.sessions}次记录）</div>`;
    }
    if (p.chronic_symptoms && p.chronic_symptoms.length){
      h += `<div style="margin-top:10px"><b style="font-size:13px">跨次反复症状</b><div class="tags" style="margin-top:4px">${p.chronic_symptoms.map(s=>`<span class="tag warn">${esc(s)}</span>`).join('')}</div></div>`;
    }
    if (p.top_symptoms && p.top_symptoms.length){
      h += `<div style="margin-top:8px"><b style="font-size:13px">高频症状</b><div class="tags" style="margin-top:4px">${p.top_symptoms.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div></div>`;
    }
    if (p.syndrome_history && p.syndrome_history.length){
      h += `<div style="margin-top:10px"><b style="font-size:13px">辨证历史</b><ul class="dot" style="margin-top:4px">${
        p.syndrome_history.slice(-6).reverse().map(x=>`<li>${fmtTime(x.date)} ${esc(x.syndrome||'—')}${x.treatment?'（'+esc(x.treatment)+'）':''}</li>`).join('')}</ul></div>`;
    }
    if (p.lifestyle_advice && p.lifestyle_advice.length){
      h += `<div class="final-card" style="margin-top:12px"><div class="fc-head">🌿 ${esc(p.dominant_constitution)}生活习惯建议</div><div class="fc-body"><ul class="dot">${p.lifestyle_advice.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div></div>`;
    }
    h += `<div class="disclaimer" style="margin-top:10px;font-size:12px;color:var(--muted)">画像由问诊历史推导，仅供参考；体质判定请以执业中医师面诊为准。</div>`;
    $('m-body').innerHTML = h;
    $('modal').style.display='block';
  }catch(e){ alert('获取画像失败：'+e.message); }
}

function newSession(withNotice){
  sessionId = makeId();
  localStorage.setItem('tcm_session', sessionId);
  log().innerHTML = '';
  if (withNotice) addBot('已开始新会话（上次问诊已自动存入健康档案，可随时点开回看）。请描述您的主要症状。');
  loadRecords();
}

/* ---------------- 发送与渲染 ---------------- */
function addBot(text){ const d=document.createElement('div'); d.className='msg bot'; d.textContent=text; log().appendChild(d); scroll(); return d; }
function addUser(text){ const d=document.createElement('div'); d.className='msg user'; d.textContent=text; log().appendChild(d); scroll(); }
function addBlock(cls, text){ const d=document.createElement('div'); d.className='block '+cls; d.textContent=text; log().appendChild(d); scroll(); }
function scroll(){ log().scrollTop = log().scrollHeight; }

let thinkTimer=null;
function setThinking(on){
  busy = on; $('btn-send').disabled = on;
  const t = $('thinking');
  if (on){
    const start = Date.now();
    t.style.display='block';
    thinkTimer = setInterval(()=>{ t.textContent = `助手正在思考（含LLM推理与知识库检索）… ${Math.round((Date.now()-start)/1000)}s`; }, 500);
  } else { t.style.display='none'; clearInterval(thinkTimer); }
}

async function sendMsg(force=false){
  const input = $('msg-input');
  const text = input.value.trim();
  if (!text && !force) return;
  if (busy) return;
  localStorage.setItem('tcm_session', sessionId);
  input.value='';
  if (text) addUser(force ? text + '（请求立即辨证）' : text);
  setThinking(true);
  try{
    const r = await fetch('api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        session: sessionId, message: text || '请立即给出辨证分析', force, token: authToken,
        sex: $('p-sex').value || null,
        age: $('p-age').value ? Number($('p-age').value) : null,
        pregnant: $('p-preg').checked || null,
      })
    });
    const data = await r.json();
    if (data.error){ addBot('出错了：'+data.error); return; }
    renderTurn(data);
  }catch(e){ addBot('请求失败：'+e.message+'\n（LLM推理可能需要较长时间，请稍后重试）'); }
  finally{ setThinking(false); }
}

function renderTurn(d){
  addBot(d.reply || '（继续）');
  (d.challenges||[]).forEach(c=>addBlock('challenge', c.question));
  (d.excluded_evidence||[]).forEach(x=>addBlock('excluded', x));
  if (d.is_emergency){
    const div=document.createElement('div'); div.className='emergency'; div.textContent='🚨 '+d.emergency_advice; log().appendChild(div);
    addBot('请立即就医，切勿拖延！如仍有疑问可继续留言，我可以协助解释。');
    loadRecords(); scroll(); return;
  }
  if (d.assessment && !d.final && d.assessment.primary_syndrome){
    const a=d.assessment;
    addBlock('assess', `即时辨证：${a.primary_syndrome}（置信度${Math.round(a.top[0].confidence*100)}%，信息仍在收集中）治法方向：${a.treatment_principle||'—'}`);
  }
  if (d.syndrome_change) addBlock('change', d.syndrome_change);
  if (d.final){
    renderFinal(d.final);
    addBot('✅ 报告已生成，同时已存入右侧「🗂 健康档案」。您可以继续提问（方剂、调护、禁忌等），或补充新症状更新分析；刷新页面会自动恢复本次对话；点击「⟳ 新会话」开始新的问诊。');
  }
  loadRecords(); scroll();
}

function buildFinalHTML(f){
  let html = `<div class="fc-body">`;
  if (f.is_emergency){
    html += `<div class="emergency" style="border-radius:8px">🚨 ${f.emergency_advice}</div>`;
  } else {
    html += `<div><b>规范化症状：</b><div class="tags" style="margin-top:4px">${(f.symptoms_canonical||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div></div>`;
    (f.syndromes||[]).forEach((c,i)=>{
      html += `<div class="synd ${i===0?'main':''}">
        <h4>${i===0?'【主】':''}${esc(c.name)}</h4>
        <div class="meta">${c.system||''} ${c.organ?'· '+c.organ:''}</div>
        <div class="bar"><i style="width:${Math.round(c.confidence*100)}%"></i></div>
        <div class="kv">
          <b>治法</b><span>${esc(c.treatment||'—')}</span>
          <b>匹配症状</b><span>${(c.matched_symptoms||[]).map(esc).join('、')||'—'}</span>
          <b>舌脉</b><span>${esc(c.tongue||'—')} / ${esc(c.pulse||'—')}</span>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(c.rationale||'')}</div>
      </div>`;
    });
    if (f.treatment_principle) html += `<div class="kv"><b>治法</b><span>${esc(f.treatment_principle)}</span></div>`;
    if ((f.formula_suggestions||[]).length) html += `<div class="kv"><b>代表方剂</b><span>${esc(f.formula_suggestions.join('；'))}（须经执业中医师辨证）</span></div>`;
    if ((f.otc_suggestions||[]).length) html += `<div class="kv"><b>中成药参考</b><span>${esc(f.otc_suggestions.join('、'))}</span></div>`;
    if ((f.followup_questions||[]).length) html += `<div><b>建议补充信息：</b><ul class="dot">${f.followup_questions.map(q=>`<li>（${esc(q.dimension)}）${esc(q.question)}</li>`).join('')}</ul></div>`;
    if ((f.care_advice||[]).length) html += `<div><b>调护建议：</b><ul class="dot">${f.care_advice.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`;
    if ((f.lifestyle_advice||[]).length) html += `<div><b>🌿 生活习惯建议（按体质）：</b><ul class="dot">${f.lifestyle_advice.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`;
    if ((f.special_population_notes||[]).length) html += `<div><b>特殊人群提示：</b><ul class="dot">${f.special_population_notes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`;
    if ((f.red_flags||[]).length) html += `<div><b>就医提示：</b><ul class="dot">${f.red_flags.map(x=>`<li>[${x.level}] ${esc(x.name)}：${esc(x.advice)}</li>`).join('')}</ul></div>`;
  }
  html += `<div class="disclaimer">${esc(f.disclaimer||'')}</div></div>`;
  return html;
}

function renderFinal(f){
  const card=document.createElement('div'); card.className='final-card';
  card.innerHTML = `<div class="fc-head">📋 辨证参考报告</div>` + buildFinalHTML(f);
  log().appendChild(card);
}

async function demo(text){
  newSession(false);
  localStorage.setItem('tcm_session', sessionId);
  addUser(text);
  $('msg-input').value = text;
  $('msg-input').value='';
  setThinking(true);
  try{
    const r = await fetch('api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({session: sessionId, message: text, token: authToken, sex:$('p-sex').value||null,
        age: $('p-age').value?Number($('p-age').value):null, pregnant: $('p-preg').checked||null})
    });
    renderTurn(await r.json());
  }catch(e){ addBot('请求失败：'+e.message); }
  finally{ setThinking(false); }
}

/* ---------------- 知识查询 ---------------- */
async function runQuery(){
  const q = $('q-input').value.trim(); if(!q) return;
  const box = $('q-result'); box.innerHTML = '<div class="item">查询中…</div>';
  try{
    const resp = await fetch('api/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,mode:$('q-mode').value})});
    const r = await resp.json();
    renderQuery(r);
  }catch(e){ box.innerHTML = '<div class="item">查询失败：'+e.message+'</div>'; }
}
function renderQuery(r){
  const box = $('q-result');
  if (r.mode==='llm'){
    let h = `<div class="item"><b>🤖 ${r.answer.replace(/\n/g,'<br>')}</b>`;
    if ((r.key_points||[]).length) h += `<br><br>要点：<ul class="dot">${r.key_points.map(k=>`<li>${k}</li>`).join('')}</ul>`;
    if ((r.sources||[]).length) h += `<br><span class="src">来源：${r.sources.map(s=>s.file+(s.section?'::'+s.section:'')).join('；')}</span>`;
    h += `</div>`;
    box.innerHTML = h;
  } else {
    box.innerHTML = (r.results||[]).map(c=>`<div class="item"><b>${c.title}${c.section?' - '+c.section:''}</b><br>${c.excerpt}<br><span class="src">${c.file}</span></div>`).join('') || '<div class="item">未检索到相关内容</div>';
  }
}

/* ---------------- 配伍检查 ---------------- */
async function runHerb(){
  const raw = $('h-input').value.trim(); if(!raw) return;
  const herbs = raw.split(/[,，、\s]+/).filter(Boolean);
  const box = $('h-result'); box.innerHTML='<div class="item">检查中…</div>';
  try{
    const resp = await fetch('api/herb-safety',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({herbs,pregnant:$('h-preg').checked})});
    const r = await resp.json();
    let h = `<div class="item"><b class="${r.is_safe?'herb-ok':'herb-bad'}">${r.is_safe?'✓ 未检出配伍禁忌':'⚠ 检出配伍问题'}</b><br>${r.advice}`;
    if ((r.conflicts||[]).length) h += `<br><br>禁忌：<ul class="dot">${r.conflicts.map(c=>`<li>${c}</li>`).join('')}</ul>`;
    if ((r.pregnancy_warnings||[]).length) h += `妊娠警示：<ul class="dot">${r.pregnancy_warnings.map(c=>`<li>${c}</li>`).join('')}</ul>`;
    if ((r.toxicity_notes||[]).length) h += `毒性标注：<ul class="dot">${r.toxicity_notes.map(c=>`<li>${c}</li>`).join('')}</ul>`;
    h += `</div>`;
    box.innerHTML = h;
  }catch(e){ box.innerHTML='<div class="item">检查失败：'+e.message+'</div>'; }
}

/* ---------------- 健康档案 ---------------- */
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtTime(t){
  const d = new Date((t||0)*1000);
  const p = n => String(n).padStart(2,'0');
  return `${d.getMonth()+1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function loadRecords(){
  try{
    const r = await (await fetch('api/records'+(authToken?'?token='+encodeURIComponent(authToken):''))).json();
    const box = $('r-list');
    if (!(r.records||[]).length){ box.innerHTML='<div class="t" style="color:var(--muted)">暂无档案，完成一次问诊后自动生成</div>'; return; }
    box.innerHTML = r.records.map(x=>`
      <div class="rec-item" onclick="openRecord('${x.id}')">
        <div class="s">${x.has_final ? '📋 '+esc(x.primary_syndrome||'辨证报告') : '🟢 进行中'}</div>
        <div class="t">${fmtTime(x.updated_at)} · ${x.patient&&x.patient.sex?x.patient.sex+' '+((x.patient.age??'')+'岁').trim():'信息未填'} · ${x.turns}条对话${x.has_final?' · 有报告':''}</div>
        <div class="t" style="color:#374151">${esc((x.symptoms||[]).slice(0,6).join('、'))||'—'}</div>
      </div>`).join('');
  }catch(e){ /* 静默 */ }
}

async function openRecord(id){
  try{
    const rec = await (await fetch('api/records/'+id+(authToken?'?token='+encodeURIComponent(authToken):''))).json();
    if (rec.error){ alert('档案不存在'); return; }
    window._recId = id;
    const p = rec.patient||{};
    $('m-title').textContent = `问诊档案 · ${fmtTime(rec.created_at)} ~ ${fmtTime(rec.updated_at)}`;
    let h = `<div style="font-size:13px;color:var(--muted);margin-bottom:10px">患者：${p.sex||'未知'} / ${p.age!=null?p.age+'岁':'年龄未知'}${p.pregnant?' · 怀孕':''} · 对话${(rec.messages||[]).length}条 · 报告${(rec.finals||[]).length}次</div>`;
    (rec.finals||[]).forEach((f,i)=>{
      h += `<div class="final-card" style="margin-bottom:12px"><div class="fc-head">📋 辨证报告 ${i+1} · ${fmtTime(f.time)}</div>${buildFinalHTML(f.result)}</div>`;
    });
    h += `<b style="font-size:13px">💬 对话记录</b><div style="display:flex;flex-direction:column;margin-top:8px;max-height:420px;overflow-y:auto">`;
    (rec.messages||[]).forEach(m=>{
      let meta = '';
      (m.meta&&m.meta.challenges||[]).forEach(c=>{ meta += `<div class="meta-line">⚠ ${esc(c)}</div>`; });
      if (m.meta&&m.meta.syndrome_change) meta += `<div class="meta-line" style="color:#5b21b6">⟳ ${esc(m.meta.syndrome_change)}</div>`;
      h += `<div class="msgline ${m.role}"><b>${m.role==='user'?'我':'助手'}：</b>${esc(m.text)}${meta}</div>`;
    });
    h += `</div>`;
    $('m-body').innerHTML = h;
    $('modal').style.display='block';
  }catch(e){ alert('读取档案失败：'+e.message); }
}

async function delRecord(){
  if (!window._recId || !confirm('确定删除该档案？删除后不可恢复。')) return;
  try{
    await fetch('api/records/'+window._recId+(authToken?'?token='+encodeURIComponent(authToken):''), {method:'DELETE'});
    closeModal(); loadRecords();
  }catch(e){ alert('删除失败：'+e.message); }
}

/* ---------------- 会话还原/继续 ---------------- */
async function resumeRecord(id, silent=false){
  if (!id) return;
  try{
    const rec = await (await fetch('api/records/'+id+(authToken?'?token='+encodeURIComponent(authToken):''))).json();
    if (rec.error){
      if (!silent) alert('档案不存在');
      return;
    }
    sessionId = id;               // 后端将自动从档案还原辨证上下文
    localStorage.setItem('tcm_session', id);
    window._resumeOk = true;
    log().innerHTML = '';
    // 按时间顺序回放消息与报告
    const events = [];
    (rec.messages||[]).forEach(m=>events.push({t:m.time, type:'msg', m}));
    (rec.finals||[]).forEach(f=>events.push({t:f.time, type:'final', f}));
    events.sort((a,b)=>a.t-b.t);
    events.forEach(e=>{
      if (e.type==='msg'){
        if (e.m.role==='user'){ addUser(e.m.text); }
        else {
          addBot(e.m.text);
          (e.m.meta&&e.m.meta.challenges||[]).forEach(c=>addBlock('challenge', c));
          if (e.m.meta&&e.m.meta.syndrome_change) addBlock('change', e.m.meta.syndrome_change);
          (e.m.meta&&e.m.meta.excluded_evidence||[]).forEach(x=>addBlock('excluded', x));
        }
      } else {
        const card=document.createElement('div'); card.className='final-card';
        card.innerHTML = `<div class="fc-head">📋 辨证报告（历史）· ${fmtTime(e.f.time)}</div>` + buildFinalHTML(e.f.result);
        log().appendChild(card);
      }
    });
    addBot('✅ 已恢复上次问诊会话（辨证上下文已加载）。您可以继续提问或补充症状，我会在此基础上更新分析。');
    closeModal(); scroll();
  }catch(e){ if (!silent) alert('还原失败：'+e.message); }
}

function closeModal(){ $('modal').style.display='none'; window._recId=null; }
</script>
